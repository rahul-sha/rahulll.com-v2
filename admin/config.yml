# The forms on the /admin page. Sveltia CMS reads this file and draws one form per entry below.
# Each save is a commit to main on GitHub, and Vercel rebuilds the live site from it in about a minute.
# Every field the build reads (build/build.js) is listed here; a field left out would be lost when an entry is saved.
# %SITE% is filled in by the build with the site's own address.

backend:
  name: github
  repo: rahul-sha/rahulll.com-v2
  branch: main
  base_url: "%SITE%"
  auth_endpoint: api/auth
  commit_messages:
    create: "Add {{collection}}: {{slug}} (from the editor)"
    update: "Update {{collection}}: {{slug}} (from the editor)"
    delete: "Remove {{collection}}: {{slug}} (from the editor)"
    uploadMedia: "Add file {{path}} (from the editor)"
    deleteMedia: "Remove file {{path}} (from the editor)"

site_url: "%SITE%"
display_url: "%SITE%"
logo:
  src: /favicon.svg

# images and clips live beside the entry they belong to; each collection says where
media_folder: content/uploads

output:
  omit_empty_optional_fields: true

collections:
  - name: projects
    label: Projects
    label_singular: project
    description: Engineering work. Each project is its own window on the Engineering workspace.
    folder: content/projects
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    delete: true
    slug: "{{fields.short}}"
    summary: "{{title}}"
    sortable_fields: [order, title, year]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: short, label: Short name, widget: string, hint: "One word for the dock, such as Cirrus. For a new project it also names its folder." }
      - name: stage
        label: Stage
        widget: select
        hint: Sets the window's colour and where the project is listed.
        options:
          - { label: Design, value: design }
          - { label: Simulate, value: simulate }
          - { label: Make, value: make }
          - { label: Test, value: test }
      - { name: image, label: Main image, widget: image, hint: "Shown at the top of the window and on the project's tile." }
      - { name: caption, label: Caption, widget: string, required: false, hint: One line under the main image. }
      - { name: flagship, label: Flagship, widget: boolean, default: false, required: false, hint: Lists it under Start here. }
      - { name: start_open, label: Open at the start, widget: boolean, default: false, required: false, hint: Opens this window on the Engineering workspace when the site loads. }
      - { name: order, label: Order, widget: number, value_type: int, default: 99, required: false, hint: Lower numbers come first. }
      - { name: year, label: Year, widget: string, required: false, hint: "Such as 2021, or 2018 to 2021." }
      - { name: role, label: Role, widget: string, required: false, hint: What you did on it. }
      - { name: team, label: Team, widget: string, required: false, hint: "Solo, or who you worked with." }
      - { name: outcome, label: Outcome, widget: string, required: false, hint: "One line under the title: the result in plain words, with a number if you have one." }
      - { name: result, label: Result, widget: text, required: false, hint: "A sentence on what it changed: time saved, tolerance held, or the difference found." }
      - name: tools
        label: Tools
        widget: list
        required: false
        hint: Leave empty to use the first three tools of the stage from Skills.
        field: { name: tool, label: Tool, widget: string }
      - name: steps
        label: What I did
        widget: list
        required: false
        field: { name: step, label: Step, widget: text }
      - name: media
        label: More views
        label_singular: view
        widget: list
        required: false
        summary: "{{label}}"
        fields:
          - name: kind
            label: Kind
            widget: select
            default: section
            options:
              - { label: Picture, value: section }
              - { label: Video clip, value: video }
          - { name: label, label: Caption, widget: string }
          - { name: file, label: File, widget: file, hint: "A picture, or a short silent MP4 or WebM clip." }
      - { name: body, label: The problem, widget: markdown, required: false, hint: A short paragraph on the problem the project solved. }

  - name: prints
    label: 3D prints
    label_singular: print
    description: Parts printed at home. Each print is its own window, opened from the 3D prints list.
    folder: content/prints
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    delete: true
    slug: "{{fields.short}}"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: short, label: Short name, widget: string, hint: "One word for the dock, such as Deck. For a new print it also names its folder." }
      - { name: image, label: Main image, widget: image, required: false, hint: A render or the best photo. }
      - { name: caption, label: Caption, widget: string, required: false }
      - { name: why, label: Why it exists, widget: string, hint: One line on what it is for. }
      - { name: printer, label: Printer, widget: string, default: Bambu Lab A1 }
      - { name: material, label: Material, widget: string, hint: "Such as PLA or PETG." }
      - { name: layer, label: Layer height, widget: string, required: false, hint: "Such as 0.2 mm." }
      - { name: infill, label: Infill, widget: string, required: false, hint: "Such as 15%." }
      - { name: supports, label: Supports, widget: string, required: false, hint: "Such as none, or tree." }
      - { name: time, label: Print time, widget: string, required: false, hint: "Such as 4h 10m." }
      - { name: makerworld, label: MakerWorld link, widget: string, required: false, hint: Leave empty for a private design. }
      - &accent
        name: accent
        label: Colour
        widget: select
        default: a1
        hint: One of the site's four accent colours.
        options:
          - { label: Accent 1 (the Make colour), value: a1 }
          - { label: Accent 2 (the Design colour), value: a2 }
          - { label: Accent 3 (the Simulate colour), value: a3 }
          - { label: Accent 4 (the Test colour), value: a4 }
      - { name: order, label: Order, widget: number, value_type: int, default: 99, required: false, hint: Lower numbers come first. }
      - name: notes
        label: Design notes
        widget: list
        required: false
        field: { name: note, label: Note, widget: text }
      - name: photos
        label: Photos in use
        widget: list
        required: false
        field: { name: photo, label: Photo, widget: image }
      - { name: body, label: The story, widget: markdown, required: false, hint: "A short paragraph: where it lives and what it replaced." }

  - name: sites
    label: Shipped sites
    label_singular: site
    description: Websites and apps on the Off the clock workspace.
    folder: content/sites
    # _template.md is for copying by hand, so it is kept out of the list
    filter: { field: host, pattern: "^(?!example\\.com$)" }
    media_folder: "/content/sites/{{slug}}"
    public_folder: ""
    create: true
    delete: true
    slug: "{{fields.short}}"
    summary: "{{title}}"
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Name, widget: string }
      - { name: short, label: Short name, widget: string, hint: "One or two words for the dock. For a new site it also names its file." }
      - { name: host, label: Address, widget: string, hint: "Without https://, such as thegridwalk.app. A new address that should load inside the site must also be added to vercel.json; ask Claude." }
      - { name: tag, label: Kind, widget: string, required: false, hint: What kind of thing it is. }
      - *accent
      - { name: stats, label: Numbers, widget: string, required: false, hint: A few numbers separated by ·. }
      - { name: stack, label: Built with, widget: string, required: false }
      - { name: private, label: Private, widget: boolean, default: false, required: false, hint: A private app has no live version to open. }
      - { name: embed, label: Load inside the site, widget: boolean, default: true, required: false, hint: Turn off if the site refuses to load inside another page; it then opens in a new tab. }
      - { name: shot, label: Screenshot, widget: image, required: false, hint: A desktop screenshot. Without one a drawing is shown. }
      - { name: video, label: Clip, widget: file, required: false, hint: A short silent clip that plays in place of the screenshot. }
      - { name: width, label: Width, widget: select, required: false, options: ["1/3", "1/2", "2/3"], hint: How much of the screen its window takes. }
      - { name: under, label: Stack under, widget: string, required: false, hint: "The file name of another site, such as gridwalk, to share its column (desktop only)." }
      - { name: order, label: Order, widget: number, value_type: int, default: 99, required: false, hint: Lower numbers come first. }
      - { name: body, label: Description, widget: text, required: false, hint: One or two lines on what the site is. }

  - name: pages
    label: Pages
    description: The single pages of the site, such as About and the resume.
    files:
      - name: about
        label: About and contact
        file: content/about/index.md
        media_folder: /content/about
        public_folder: ""
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: place, label: Place, widget: string }
          - { name: employer, label: Employer, widget: string, required: false, hint: "Shown as: Currently (role) at (employer)." }
          - { name: headline, label: Headline, widget: string, required: false }
          - { name: image, label: Portrait, widget: image, required: false }
          - { name: open_to, label: Open to, widget: string, required: false, hint: "One line after the Currently line, such as: Open to freelance CAD and CAM work." }
          - { name: email, label: Email address, widget: string, required: false, hint: Shown in the Contact window and on the resume PDF. }
          - name: links
            label: Links
            label_singular: link
            widget: list
            required: false
            summary: "{{name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: url, label: Address, widget: string }
          - { name: body, label: About text, widget: markdown, required: false, hint: "Two short paragraphs: the first is the lead line, the second is in your own voice." }

      - name: resume
        label: Resume
        file: content/resume.md
        fields:
          - &timeline
            name: jobs
            label: Experience
            label_singular: job
            widget: list
            hint: Newest first.
            summary: "{{title}}, {{place}}"
            fields:
              - { name: dates, label: Dates, widget: string, hint: "Plain text, such as Jan 2022 to now." }
              - { name: title, label: Title, widget: string }
              - { name: place, label: Place, widget: string }
              - { name: line, label: One line, widget: text, required: false, hint: The outcome of the job or the course in one line. }
          - { <<: *timeline, name: study, label: Education, label_singular: course }
          - name: tools
            label: Tools
            widget: list
            required: false
            field: { name: tool, label: Tool, widget: string }
          - { name: body, label: Note, widget: text, required: false, hint: A note to yourself. It is not shown on the site. }

      - name: skills
        label: Skills
        file: content/skills.md
        fields:
          - name: stages
            label: Stages
            widget: object
            fields:
              - &stage
                name: design
                label: Design
                widget: object
                fields:
                  - name: tools
                    label: Tools
                    widget: list
                    field: { name: tool, label: Tool, widget: string }
                  - name: proof
                    label: Proof
                    widget: list
                    required: false
                    hint: "The folder name of each project that proves it, such as cirrus-jet."
                    field: { name: project, label: Project folder, widget: string }
              - { <<: *stage, name: simulate, label: Simulate }
              - { <<: *stage, name: make, label: Make }
              - { <<: *stage, name: test, label: Test }
          - name: beyond
            label: Beyond engineering
            label_singular: item
            widget: list
            required: false
            summary: "{{name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: line, label: One line, widget: string }
              - { name: opens, label: Opens, widget: string, required: false, hint: "The window it opens, such as sites, homelab, prints, or site-gridwalk." }
          - { name: body, label: Ways of working, widget: markdown, required: false }

      - name: homelab
        label: Homelab
        file: content/homelab.md
        fields:
          - { name: heading, label: Heading, widget: string, required: false }
          - name: services
            label: Services
            label_singular: service
            widget: list
            required: false
            summary: "{{name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: line, label: One line, widget: string, required: false }
              - { <<: *accent, default: a2 }
          - name: devices
            label: Hardware
            label_singular: device
            widget: list
            required: false
            summary: "{{name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: line, label: One line, widget: string, required: false }
          - { name: body, label: Lead line, widget: text, required: false }

      - name: home
        label: Smart home
        file: content/home/index.md
        media_folder: /content/home
        public_folder: ""
        fields:
          - { name: heading, label: Heading, widget: string, required: false }
          - name: dashboards
            label: Dashboards
            label_singular: dashboard
            widget: list
            required: false
            summary: "{{name}}"
            fields:
              - { name: name, label: Name, widget: string }
              - { name: line, label: One line, widget: string, required: false }
              - { name: image, label: Screenshot, widget: image, required: false, hint: Blur anything private first. A dashboard with no screenshot shows as coming soon. }
              - { name: alt, label: Description for screen readers, widget: text, required: false }
          - { name: body, label: Note, widget: text, required: false }

      - name: gaming
        label: Gaming
        file: content/gaming.md
        fields:
          - { name: steam, label: Steam profile link, widget: string, required: false }
          - name: library
            label: Steam library numbers
            widget: object
            required: false
            fields:
              - { name: games, label: Games, widget: number, value_type: int, required: false }
              - { name: dlc, label: DLC, widget: number, value_type: int, required: false }
              - { name: reviews, label: Reviews, widget: number, value_type: int, required: false }
              - { name: wishlist, label: On wishlist, widget: number, value_type: int, required: false }
          - &games
            name: showcase
            label: Steam showcase
            widget: list
            required: false
            field: { name: game, label: Game, widget: string }
          - { <<: *games, name: now, label: Playing now }
          - { <<: *games, name: alltime, label: All-time favourites }
          - name: kit
            label: The kit
            widget: list
            required: false
            field: { name: item, label: Item, widget: string }
          - { name: body, label: Note, widget: text, required: false }

      - name: prints-page
        label: 3D prints page
        file: content/prints.md
        fields:
          - { name: cad, label: Designed in, widget: string, required: false }
          - { name: makerworld, label: MakerWorld profile link, widget: string, required: false }
          - { name: body, label: Note, widget: text, required: false }
