<style>
/* Mockup A, Noctalia faithful: floating top bar, floating dock, rounded columns on a night wallpaper.
   Palette follows Noctalia's default scheme: night surface, lemon primary, periwinkle secondary, mint tertiary. */
:root {
  --bg: #070722; --surf: #11112d; --surf2: #1a1a3d; --line: #262663; --fg: #f3edf7; --mute: #8b8fc4;
  --a1: #fff59b; --a2: #a9aefe; --a3: #9bfece; --a4: #ff8fa3;
  --a1-ink: #fff59b; --a2-ink: #a9aefe; --a3-ink: #9bfece; --a4-ink: #ff8fa3;
  --on-a: #070722; --ring: #a9aefe; --glass: rgba(17, 17, 45, .78);
  --ui: "Figtree", "Segoe UI", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.22, 1, .36, 1); --r: 18px; --dur: .45s;
  --blur: 14px; --win-op: 100%; --bar-op: 78%; --ring-w: 2px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #e9e6f7; --surf: #fbfaff; --surf2: #f0eefb; --line: #d6d2f0; --fg: #1b1a33; --mute: #5e5f8c;
  --a1: #ffe14d; --a2: #6f77f2; --a3: #2fd59a; --a4: #f2557a;
  --a1-ink: #7a6500; --a2-ink: #4048c9; --a3-ink: #0b7d55; --a4-ink: #b51f45;
  --on-a: #1b1a33; --ring: #6f77f2; --glass: rgba(251, 250, 255, .8); color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #e9e6f7; --surf: #fbfaff; --surf2: #f0eefb; --line: #d6d2f0; --fg: #1b1a33; --mute: #5e5f8c;
  --a1: #ffe14d; --a2: #6f77f2; --a3: #2fd59a; --a4: #f2557a;
  --a1-ink: #7a6500; --a2-ink: #4048c9; --a3-ink: #0b7d55; --a4-ink: #b51f45;
  --on-a: #1b1a33; --ring: #6f77f2; --glass: rgba(251, 250, 255, .8); color-scheme: light; }
body { font: 15px/1.55 var(--ui); background: var(--bg); }

/* wallpaper: soft colour fields plus a volute spiral, drawn on a canvas */
#wall { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
#desk > .bar, #desk > .viewport, #desk > .dock { position: relative; z-index: 1; }
#desk > .bar { z-index: 2; }
.launcher, .hotkeys, .session { z-index: 50; }

/* bar */
.bar { display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 6px 8px; padding-left: max(8px, env(safe-area-inset-left)); background: color-mix(in srgb, var(--surf) var(--bar-op), transparent); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); backdrop-filter: blur(var(--blur)) saturate(1.4); border-radius: calc(var(--r) * .85); border: 1px solid var(--line); min-height: 36px; transition: margin var(--dur) var(--ease), border-radius var(--dur) var(--ease); }
.b-sec { display: flex; align-items: center; gap: 6px; min-width: 0; }
.b-left { flex: 1; } .b-right { flex: 1; justify-content: flex-end; }
.ib { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; border: 0; background: transparent; color: var(--fg); cursor: pointer; }
.ib:hover { background: var(--surf2); }
.ib svg { width: 18px; height: 18px; }
/* Zoom out: the three columns fold into a grid of tiles on hover, and stay that way in the overview */
.zoomb { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 10px; border: 0; border-radius: calc(var(--r) * .55); background: var(--surf2); color: var(--fg); font: 700 13px var(--ui); cursor: pointer; transition: background .2s, color .2s; }
.zoomb:hover, .zoomb:focus-visible { background: color-mix(in srgb, var(--a2) 22%, var(--surf2)); }
.zoomb.on { background: var(--a2); color: var(--on-a); }
.zoomb svg { width: 16px; height: 16px; flex: none; }
.zoomb rect { transition: x .35s var(--ease), y .35s var(--ease), width .35s var(--ease), height .35s var(--ease), opacity .25s; }
.zoomb .z4 { opacity: 0; }
.zoomb:is(:hover, :focus-visible, .on) .z1 { x: 2px; y: 2px; width: 5px; height: 5px; }
.zoomb:is(:hover, :focus-visible, .on) .z2 { x: 9px; y: 2px; width: 5px; height: 5px; }
.zoomb:is(:hover, :focus-visible, .on) .z3 { x: 2px; y: 9px; width: 5px; height: 5px; }
.zoomb:is(:hover, :focus-visible, .on) .z4 { opacity: 1; }
.zoomb .zl { display: inline-grid; white-space: nowrap; }
.zoomb .zl span { grid-area: 1 / 1; transition: opacity .25s, translate .3s var(--ease); }
.zoomb .zl span + span, .zoomb.on .zl span:first-child { opacity: 0; translate: 0 -8px; }
.zoomb .zl span + span { translate: 0 8px; }
.zoomb.on .zl span + span { opacity: 1; translate: 0 0; }
/* narrower screens keep the icon only, so the workspace names and clock still fit */
@media (max-width: 1180px) { .zoomb { padding: 0 9px; } .zoomb .zl { display: none; } }
@media (prefers-reduced-motion: reduce) { .zoomb rect, .zoomb .zl span { transition: none; } }
.logo { background: var(--a1); color: var(--on-a); }
.logo:hover { background: var(--a1); filter: brightness(1.05); }
.pills { display: flex; gap: 3px; align-items: center; padding: 2px; border-radius: 12px; background: color-mix(in srgb, var(--surf2) 70%, transparent); }
.pill { --wa: var(--a2); display: inline-flex; gap: 6px; align-items: center; height: 30px; padding: 0 9px 0 3px; border-radius: 10px; border: 0; background: transparent; color: var(--mute); font: 700 12.5px var(--ui); cursor: pointer; white-space: nowrap; transition: background .25s, color .25s; }
.pill[data-i="0"] { --wa: var(--a1); } .pill[data-i="1"] { --wa: var(--a2); } .pill[data-i="2"] { --wa: var(--a3); } .pill[data-i="3"] { --wa: var(--a4); }
/* each workspace keeps its own colour: the icon is tinted at rest and fills in when that workspace is open */
.pill b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; color: color-mix(in srgb, var(--wa) 72%, var(--fg)); transition: background .25s, color .25s, transform .25s; }
.pill b svg { width: 16px; height: 16px; }
.pill:hover { color: var(--fg); background: color-mix(in srgb, var(--wa) 10%, transparent); }
.pill:hover b { transform: translateY(-1px); }
.pill.on { background: color-mix(in srgb, var(--wa) 18%, var(--surf)); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.15); }
.pill.on b { background: var(--wa); color: var(--on-a); }
.phone .b-right { flex: none; } .phone .b-left { gap: 4px; } .phone .pills { flex: 0 1 auto; min-width: 0; overflow: hidden; gap: 1px; } .phone .pill { min-width: 26px; justify-content: center; padding: 0 2px; gap: 4px; } .phone .pill b { width: 22px; height: 22px; } .phone .pill span { display: none; } .phone .pill.on { padding-right: 8px; } .phone .pill.on span { display: inline; max-width: 48px; overflow: hidden; text-overflow: ellipsis; }
.clock { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; padding: 6px 12px; border-radius: 11px; background: var(--surf2); border: 0; color: var(--fg); cursor: pointer; white-space: nowrap; }
.clock span { color: var(--mute); font-weight: 600; margin-left: 6px; }
.chipb { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 11px; background: var(--surf2); white-space: nowrap; }
.chipb b { color: var(--a3-ink); font-variant-numeric: tabular-nums; }

/* dock */
.dock { margin: 0 auto 12px; margin-bottom: max(12px, env(safe-area-inset-bottom)); gap: 6px; padding: 8px; border-radius: var(--r); background: color-mix(in srgb, var(--surf) var(--bar-op), transparent); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4); backdrop-filter: blur(var(--blur)) saturate(1.4); border: 1px solid var(--line); max-width: calc(100% - 24px); box-sizing: border-box; overflow-x: auto; transition: translate var(--dur) var(--ease); }
.dk { width: 48px; height: 48px; border-radius: calc(var(--r) * .7); background: var(--surf2); display: grid; place-items: center; flex: none; transition: translate .25s var(--ease), background .2s; }
.dk:hover { translate: 0 -4px; background: color-mix(in srgb, var(--accent) 30%, var(--surf2)); }
.dk-ic { color: var(--accent-ink); }
.dk-run { position: absolute; bottom: 4px; left: 50%; translate: -50% 0; width: 0; height: 3px; border-radius: 3px; background: var(--accent); transition: width .3s var(--ease); }
.dk.running .dk-run { width: 8px; }
.dk.is-focused .dk-run { width: 20px; }
.dk-tip { background: var(--surf); color: var(--fg); border: 1px solid var(--line); padding: 5px 10px; border-radius: calc(var(--r) * .5); font-size: 13px; font-weight: 600; }

/* windows */
.win { background: color-mix(in srgb, var(--surf) var(--win-op), transparent); -webkit-backdrop-filter: blur(var(--blur)) saturate(1.3); backdrop-filter: blur(var(--blur)) saturate(1.3); border-radius: var(--r); border: 1px solid var(--line); box-shadow: 0 18px 40px -22px rgba(0,0,0,.6); overflow: hidden; }
.win.focused { border-color: var(--ring); box-shadow: 0 0 0 var(--ring-w) var(--ring), 0 24px 50px -24px rgba(0,0,0,.7); }
.tb { padding: 8px 8px 8px 14px; font-weight: 600; font-size: 13px; color: var(--mute); }
.win.focused .tb { color: var(--fg); }
.tb-ic { width: 24px; height: 24px; border-radius: 8px; background: color-mix(in srgb, var(--accent, var(--a2)) 22%, transparent); color: var(--accent-ink, var(--a2)); }
.tb-b button { border-radius: 9px; color: var(--mute); }
.tb-b button:hover { background: var(--surf2); color: var(--fg); }
.wb { padding: 4px 22px 22px; }
.tb-b button, .ib, .clock, .chipb, .dk { transition-duration: .2s; }
.ws-empty kbd, kbd { font: 600 12px var(--mono); padding: 1px 6px; border-radius: 6px; background: var(--surf2); border: 1px solid var(--line); color: var(--fg); }
.overview .ws { scale: .9; }
.overview .ws.current .ws-label { color: var(--a2-ink, var(--a2)); }
.overview .ws-label { font-weight: 900; color: var(--fg); top: -70px; font-size: 48px; }

/* content */
h1, h2, h3 { line-height: 1.12; text-wrap: balance; margin: 0; }
.kicker { margin: 0 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--a2-ink); }
h2 { font-size: clamp(22px, 2.4vw, 30px); font-weight: 900; margin-bottom: 18px; }
h3 { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin: 26px 0 10px; }
.lede { font-size: 17px; }
.about { display: grid; gap: 4px; max-width: 60ch; }
.about-me { width: 112px; height: 112px; border-radius: 34px; object-fit: cover; margin: 10px 0 18px; outline: 4px solid var(--a1); outline-offset: 4px; rotate: -3deg; }
.about-h { font-size: clamp(34px, 4.4vw, 58px); font-weight: 900; letter-spacing: -.02em; margin-bottom: 10px; }
.about-h::after { content: ""; display: block; width: 72px; height: 8px; margin-top: 12px; border-radius: 8px; background: linear-gradient(90deg, var(--a1) 0 33%, var(--a2) 33% 66%, var(--a3) 66%); }
.about-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.about-links a { color: var(--fg); text-decoration: none; font-weight: 700; font-size: 14px; padding: 7px 12px; border-radius: 12px; background: var(--surf2); }
.about-links a:hover { background: var(--a2); color: var(--on-a); }
.r-tl { display: grid; gap: 14px; border-left: 3px solid var(--line); padding-left: 16px; }
.r-tl li { position: relative; }
.r-tl li::before { content: ""; position: absolute; left: -23px; top: 6px; width: 11px; height: 11px; border-radius: 4px; background: var(--a2); }
.r-tl li:first-child::before { background: var(--a1); }
.r-d { font: 600 12px var(--mono); color: var(--mute); }
.r-o { color: var(--a2-ink); font-weight: 600; font-size: 14px; }
.r-x { font-size: 14px; color: var(--mute); }
.r-tools { display: grid; gap: 8px; font-size: 14px; }
.r-bar { background: var(--surf2); border-radius: 6px; }
.r-bar i { background: linear-gradient(90deg, var(--a3), var(--a2)); border-radius: 6px; }
.r-v { font: 600 12px var(--mono); color: var(--mute); }
.chips { margin-bottom: 16px; }
.chip { padding: 6px 12px; border-radius: 11px; border: 1px solid var(--line); background: transparent; color: var(--fg); font-weight: 600; font-size: 13px; }
.chip.on { background: var(--accent, var(--a1)); border-color: transparent; color: var(--on-a); }
.p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.p-tile { gap: 6px; padding: 6px; border-radius: calc(var(--r) * .85); background: color-mix(in srgb, var(--surf2) var(--win-op), transparent); transition: background .2s, translate .2s var(--ease); }
.p-tile:hover { background: color-mix(in srgb, var(--accent) 22%, var(--surf2)); translate: 0 -3px; }
.p-tile img { border-radius: 11px; }
.p-cat { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); padding: 0 4px; }
.p-t { font-weight: 700; font-size: 14px; line-height: 1.25; padding: 0 4px 4px; }
.project figure { margin: 6px 0 18px; }
.project img { width: 100%; border-radius: 14px; display: block; background: #fff; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; counter-reset: s; }
.steps li { counter-increment: s; padding: 5px 10px; border-radius: 10px; background: var(--surf2); font-size: 13px; font-weight: 600; }
.steps li::before { content: counter(s) " "; color: var(--a1-ink); font-family: var(--mono); }
.ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.ph { aspect-ratio: 4 / 5; border-radius: 16px; display: flex; align-items: flex-end; padding: 10px; font-size: 12px; font-weight: 700; color: #0b0b22; }
.ph-0 { background: linear-gradient(160deg, #fff59b, #ff9a6b); } .ph-1 { background: linear-gradient(160deg, #9bfece, #4c8cff); }
.ph-2 { background: linear-gradient(160deg, #a9aefe, #ff8fa3); } .ph-3 { background: linear-gradient(160deg, #303080, #9bfece); color: #fff; }
.ph-4 { background: linear-gradient(160deg, #ff8fa3, #fff59b); } .ph-5 { background: linear-gradient(160deg, #4c8cff, #a9aefe); }
.ha-tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.ha-tab { display: grid; gap: 4px; align-content: start; text-align: left; min-height: 72px; padding: 12px 14px; border: 0; border-radius: var(--r); background: color-mix(in srgb, var(--surf2) var(--win-op), transparent); color: var(--fg); font: inherit; cursor: pointer; transition: background .25s, color .25s, transform .2s; }
.ha-tab b { font-size: 15px; font-weight: 800; }
.ha-tab span { font-size: 12.5px; color: var(--mute); }
.ha-tab:hover:not(.soon):not(.on) { transform: translateY(-1px); background: color-mix(in srgb, var(--accent) 16%, var(--surf2)); }
.ha-tab.on { background: var(--accent); color: var(--on-a); }
.ha-tab.on span { color: inherit; opacity: .8; }
.ha-tab.soon { background: transparent; outline: 1.5px dashed color-mix(in srgb, var(--mute) 50%, transparent); outline-offset: -1.5px; cursor: default; }
.ha-shot { position: relative; display: block; border-radius: var(--r); overflow: hidden; background: var(--surf2); }
.ha-shot img { display: block; width: 100%; height: auto; aspect-ratio: 1891 / 1057; object-fit: cover; }
.ha-zoom { position: absolute; right: 10px; bottom: 10px; display: inline-flex; gap: 6px; align-items: center; padding: 6px 10px; border-radius: 10px; background: rgba(11, 12, 26, .72); color: #fff; font: 700 12px var(--ui); opacity: 0; transition: opacity .2s; }
.ha-zoom svg { width: 14px; height: 14px; }
.ha-shot:hover .ha-zoom, .ha-shot:focus-visible .ha-zoom { opacity: 1; }
.ha-empty { padding: 40px 16px; text-align: center; color: var(--mute); }
.phone .ha-zoom { opacity: 1; }
.phone .ha-tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; } .phone .ha-tab { min-height: 0; padding: 10px; } .phone .ha-tab b { font-size: 13.5px; } .phone .ha-tab span { font-size: 11.5px; }
.lab { display: grid; gap: 6px; font-size: 14px; }
.lab li { padding: 8px 12px; border-radius: 12px; background: var(--surf2); }
.contact .c-mail { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font: 600 18px var(--mono); }
.c-copy { font: 700 13px var(--ui); padding: 7px 12px; border-radius: 11px; border: 0; background: var(--a1); color: var(--on-a); cursor: pointer; }
.win[data-key="terminal"] { background: color-mix(in srgb, var(--surf) 88%, var(--bg)); }
.term { font: 13.5px/1.6 var(--mono); }
.t-ps { color: var(--a3-ink); }
.t-dir { color: var(--a2-ink); font-weight: 600; }
.f-logo { color: var(--a1-ink); }
.t-line b { color: var(--a1-ink); }

/* launcher, hotkeys, toasts, session menu */
.launcher, .hotkeys, .session { background: rgba(7, 7, 34, .35); backdrop-filter: blur(3px); }
.ln-box, .hk-box, .ss-box { background: var(--surf); border: 1px solid var(--line); border-radius: 22px; padding: 12px; box-shadow: 0 30px 70px -30px rgba(0,0,0,.7); }
.ln-box input { padding: 12px 14px; border-radius: 14px; border: 0; background: var(--surf2); color: var(--fg); font-size: 16px; outline: none; margin-bottom: 8px; }
.ln-list li { padding: 9px 12px; border-radius: 12px; font-weight: 600; }
.ln-list li.sel { background: var(--a2); color: var(--on-a); }
.ln-list li.sel .ln-h { color: var(--on-a); }
.ln-h { font-size: 12px; color: var(--mute); }
.ln-foot { font-size: 12px; color: var(--mute); margin: 8px 4px 0; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hk-box { padding: 22px; }
.hk-box h2 { margin-bottom: 6px; }
.hk-sub { color: var(--mute); font-size: 13px; margin: 0 0 16px; }
.hk-box dl { font-size: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.hk-box dl div { justify-content: flex-start; }
.hk-box dt { flex: 0 0 150px; }
.hk-box dd { text-align: left; }
.hk-box > p:last-child { margin: 18px 0 0; }
.hk-box dt { white-space: nowrap; }
.hk-box dd { color: var(--mute); }
.toasts { top: 58px; right: 14px; width: min(320px, calc(100% - 28px)); }
.toast { background: var(--surf); border: 1px solid var(--line); border-left: 4px solid var(--a1); border-radius: 16px; padding: 10px 14px; font-size: 13px; box-shadow: 0 14px 30px -18px rgba(0,0,0,.6); }
.toast strong { font-size: 14px; }
.toast span { color: var(--mute); }
.session { inset: 0; display: grid; place-items: center; padding: 16px; }
.ss-box { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 16px; width: min(560px, 100%); box-sizing: border-box; }
.ss-box button { display: grid; gap: 8px; place-items: center; padding: 18px 8px; border-radius: 16px; border: 0; background: var(--surf2); color: var(--fg); font: 700 14px var(--ui); cursor: pointer; }
.ss-box button:hover, .ss-box button:focus-visible { background: var(--a4); color: var(--on-a); }
.ss-box svg { width: 26px; height: 26px; }
.ss-box p { grid-column: 1 / -1; margin: 4px 0 0; text-align: center; color: var(--mute); font-size: 13px; }

/* intro card on first load */
.hello { position: absolute; left: 50%; bottom: 84px; translate: -50% 0; z-index: 40; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; padding: 8px 14px; border-radius: 14px; background: var(--a1); color: var(--on-a); font-weight: 700; font-size: 13px; width: max-content; max-width: calc(100% - 32px); box-sizing: border-box; }

.hello button { border: 0; background: transparent; font: inherit; color: inherit; text-decoration: underline; cursor: pointer; }

/* browser windows */
.win[data-kind="site"] .wb { padding: 0; overflow: hidden; display: flex; }
.br { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.br-bar { display: flex; align-items: center; gap: 4px; padding: 0 10px 8px; }
.br-ib { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; border: 0; background: transparent; color: var(--mute); cursor: pointer; flex: none; }
.br-ib:not(:disabled):hover { background: var(--surf2); color: var(--fg); }
.br-ib:disabled { opacity: .4; cursor: default; }
.br-ib svg { width: 15px; height: 15px; }
.br-url { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; padding: 6px 12px; border-radius: 999px; background: color-mix(in srgb, var(--surf2) var(--win-op), transparent); font: 500 13px var(--mono); color: var(--fg); }
.br-url svg { width: 13px; height: 13px; color: var(--a3-ink); flex: none; }
.br-url span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.br-view { position: relative; flex: 1; min-height: 0; margin: 0 8px; border-radius: calc(var(--r) * .7); overflow: hidden; border: 1px solid var(--line); }
.br-view iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
.standin { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; }
/* the button that swaps the stand-in for the live site, floating over the drawing in the window's accent */
.br-go { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; z-index: 2; display: inline-flex; gap: 8px; align-items: center; padding: 9px 16px; border: 0; border-radius: 999px; background: var(--accent, var(--a1)); color: var(--on-a); font: 700 13px var(--ui); cursor: pointer; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .6); white-space: nowrap; }
.br-go:hover { filter: brightness(1.06); }
.br-live { position: absolute; inset: 0; display: block; padding: 0; border: 0; background: #000; color: inherit; cursor: pointer; overflow: hidden; }
.br-live.is-static { cursor: default; }
.br-shot { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: transform .5s, filter .3s; }
.br-live:not(.is-static):hover .br-shot, .br-live:focus-visible .br-shot { transform: scale(1.015); filter: brightness(.72); }
.br-hint { position: absolute; left: 50%; top: 50%; translate: -50% -50%; display: inline-flex; gap: 8px; align-items: center; padding: 11px 18px; border-radius: 999px; background: var(--accent, var(--a1)); color: var(--on-a); font: 700 14px var(--ui); white-space: nowrap; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .7); opacity: 0; scale: .96; transition: opacity .25s, scale .25s; pointer-events: none; }
.br-hint svg { width: 16px; height: 16px; }
.br-live:hover .br-hint, .br-live:focus-visible .br-hint { opacity: 1; scale: 1; }
.phone .br-hint { opacity: 1; scale: 1; top: auto; bottom: 14px; translate: -50% 0; }
.br-go svg { width: 16px; height: 16px; }
.br-load { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: var(--accent); }
.br-load.go { animation: br-load .9s var(--ease); }
@keyframes br-load { 0% { width: 0; opacity: 1; } 80% { width: 100%; opacity: 1; } 100% { width: 100%; opacity: 0; } }
.br-note { margin: 0; padding: 7px 14px 9px; font-size: 12px; color: var(--mute); }
.br-note a { color: var(--a2-ink); }
.win.kiosk { border-radius: calc(var(--r) * 1.2); }
.win.kiosk .tb { padding-block: 6px; }
.win.kiosk .br-view { margin: 0 10px; }

/* stand-in previews keep each site's own look, so their colours are fixed */
.s-ap { min-height: 100%; background: #000; color: #eee; font-family: "Instrument Serif", Georgia, serif; padding: 0 0 40px; }
.s-ap nav { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; padding: 14px 22px; font: 500 12px var(--ui); color: #999; }
.s-ap nav b { color: #fff; font: 400 22px "Instrument Serif", Georgia, serif; margin-right: auto; }
.s-ap nav span { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.s-ap nav i { font-style: normal; } .s-ap nav i.on { color: #fff; }
.s-ap header { padding: 40px 22px 26px; max-width: 640px; }
.s-ap header p { margin: 0; font: 500 12px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: #8a8a8a; }
.s-ap h1 { font: 400 clamp(38px, 6vw, 72px)/1 "Instrument Serif", Georgia, serif; margin: 10px 0 14px; color: #fff; }
.s-ap .ap-sub { font: italic 400 20px "Instrument Serif", Georgia, serif; letter-spacing: 0; text-transform: none; color: #bbb; }
.ap-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; padding: 0 22px; }
.ap-grid figure { margin: 0; aspect-ratio: 4 / 5; display: flex; align-items: flex-end; padding: 10px; font: 500 11px var(--ui); color: rgba(255,255,255,.85); }
.ap-0 { background: linear-gradient(180deg, #0b1f3a 0 48%, #e7a46a 50%, #10243f 52% 100%); }
.ap-1 { background: linear-gradient(180deg, #1b1b24, #3b4a6b 45%, #f0c27b 49%, #2c3550 53%, #121218); }
.ap-2 { background: linear-gradient(170deg, #2f4b3a, #8fa77a 55%, #d9d3b0); }
.ap-3 { background: radial-gradient(circle at 40% 40%, #9cc58a, #2b4a2a 70%); }
.ap-4 { background: conic-gradient(from 210deg at 60% 40%, #111, #7a2d2d, #e0a04c, #111); }
.ap-5 { background: radial-gradient(circle at 50% 35%, #c9a58a 0 18%, #3a2c26 19% 60%, #151112 61%); }
.s-ap blockquote { margin: 40px 22px 0; font: italic 400 26px/1.25 "Instrument Serif", Georgia, serif; color: #ddd; max-width: 520px; }
.s-ap cite { display: block; margin-top: 8px; font: 500 12px var(--ui); color: #888; font-style: normal; }
.s-ap footer { padding: 40px 22px 0; font: 400 18px "Instrument Serif", Georgia, serif; color: #777; }
.s-gw { --g-bg: #272822; --g-s: #33342c; --g-fg: #f8f8f2; --g-m: #a6a28c; --g1: #f92672; --g2: #a6e22e; --g3: #66d9ef; --g4: #fd971f;
  min-height: 100%; background: var(--g-bg); color: var(--g-fg); font: 14px/1.5 var(--ui); padding: 14px 18px 30px; box-sizing: border-box; }
.s-gw[data-pal="dracula"] { --g-bg: #282a36; --g-s: #343746; --g-fg: #f8f8f2; --g-m: #a4abd0; --g1: #ff79c6; --g2: #50fa7b; --g3: #8be9fd; --g4: #ffb86c; }
.s-gw[data-pal="ember"] { --g-bg: #1e1612; --g-s: #2c211b; --g-fg: #f2e6d8; --g-m: #b39a84; --g1: #e0703a; --g2: #c9a36b; --g3: #8fb3a0; --g4: #f2c46b; }
.s-gw nav { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.s-gw nav b { font-size: 20px; font-weight: 900; }
.gw-pal { display: flex; flex-wrap: wrap; gap: 4px; }
.gw-pal button { border: 0; border-radius: 999px; padding: 5px 11px; background: var(--g-s); color: var(--g-fg); font: 600 12px var(--ui); cursor: pointer; }
.gw-pal button.on { background: var(--g1); color: var(--g-bg); }
.gw-k { margin: 22px 0 2px; color: var(--g-m); font: 600 12px var(--mono); }
.s-gw h1 { margin: 0 0 12px; font-size: 30px; font-weight: 900; }
.gw-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.gw-tabs span { padding: 6px 12px; border-radius: 999px; background: var(--g-s); font-size: 12px; font-weight: 600; }
.gw-tabs span.on { background: var(--g3); color: var(--g-bg); }
.gw-pod { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
.gw-pod div { display: grid; gap: 2px; padding: 12px; border-radius: 22px; background: var(--g-s); }
.gw-pod .gw-P1 { padding-block: 26px; background: color-mix(in srgb, var(--g4) 30%, var(--g-s)); }
.gw-pod b { font-size: 22px; color: var(--g4); } .gw-pod small { color: var(--g-m); }
.gw-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
.gw-row section { padding: 12px; border-radius: 22px; background: var(--g-s); }
.gw-row h2 { margin: 0 0 10px; font-size: 14px; }
.gw-bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
.gw-bars i { flex: 1; background: var(--g2); border-radius: 4px 4px 0 0; }
.gw-heat { display: grid; grid-template-columns: repeat(18, 1fr); gap: 2px; }
.gw-heat i { aspect-ratio: 1; background: var(--g1); border-radius: 2px; }
.gw-src { margin: 14px 0 0; font-size: 12px; color: var(--g-m); }
.s-aa { min-height: 100%; background: #f6f3ec; color: #1d1b17; font: 15px/1.5 var(--ui); padding: 14px 22px 40px; box-sizing: border-box; }
.s-aa nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; font-size: 13px; }
.s-aa nav b { font: 400 20px "Instrument Serif", Georgia, serif; }
.s-aa nav span { display: flex; gap: 14px; color: #6b655a; } .s-aa nav i { font-style: normal; }
.s-aa header { padding: 46px 0 26px; }
.aa-k { margin: 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #6b655a; }
.s-aa h1 { font: 400 clamp(40px, 6.4vw, 78px)/.98 "Instrument Serif", Georgia, serif; margin: 10px 0 20px; max-width: 12ch; }
.aa-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; }
.aa-btns span { padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 13px; }
.aa-b1 { background: #1d1b17; color: #f6f3ec; } .aa-b2 { border: 1px solid #1d1b17; }
.aa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; border-block: 1px solid #ddd6c8; padding: 16px 0; }
.aa-stats b { display: block; font: 400 36px "Instrument Serif", Georgia, serif; } .aa-stats span { font-size: 13px; color: #6b655a; }
.s-aa h2 { font: 400 30px "Instrument Serif", Georgia, serif; margin: 30px 0 12px; }
.aa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.aa-c { aspect-ratio: 4 / 5; border-radius: 14px; display: flex; align-items: flex-end; padding: 12px; font-weight: 700; font-size: 13px; color: #fff; }
.aa-c0 { background: linear-gradient(160deg, #3a332a, #7a6a55); } .aa-c1 { background: linear-gradient(160deg, #6b5a45, #c9b59a); } .aa-c2 { background: linear-gradient(160deg, #24211c, #55504a); }
.aa-end { font-style: italic; }
.s-cs { min-height: 100%; background: #15171a; color: #e7e9ec; font: 14px/1.5 var(--ui); display: flex; flex-direction: column; }
.s-cs nav { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #2a2e33; }
.s-cs nav b { font-size: 18px; font-weight: 900; letter-spacing: .02em; }
.cs-badge { font: 600 11px var(--mono); padding: 2px 8px; border-radius: 6px; background: #2a2e33; color: #f0b44c; }
.cs-body { flex: 1; display: grid; grid-template-columns: 140px minmax(0, 1fr); }
.cs-body aside { border-right: 1px solid #2a2e33; padding: 14px; display: grid; align-content: start; gap: 8px; font: 500 12px var(--mono); color: #8a919a; }
.cs-body aside i { font-style: normal; }
.cs-body .main { padding: 20px; }
.s-cs h1 { margin: 0 0 8px; font-size: 22px; } .s-cs .main p { color: #9aa2ab; max-width: 52ch; }
.cs-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 16px; }
.cs-cards div { display: grid; gap: 8px; padding: 14px; border-radius: 10px; background: #1e2125; }
.cs-cards span { height: 10px; border-radius: 5px; background: #2a2e33; } .cs-cards span:first-child { width: 60%; background: #f0b44c; }

/* sites index and project links */
.si-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.si { display: grid; grid-template-columns: 120px minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; column-gap: 14px; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: color-mix(in srgb, var(--surf2) var(--win-op), transparent); color: var(--fg); font: inherit; text-align: left; cursor: pointer; transition: border-color .2s, translate .2s var(--ease); }
.si:hover { border-color: var(--accent); translate: 0 -2px; }
.si-prev { grid-row: 1 / -1; position: relative; height: 96px; border-radius: calc(var(--r) * .6); overflow: hidden; background: #000; }
.si-shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
.si-mini { position: absolute; left: 0; top: 0; width: 480px; transform: scale(.25); transform-origin: 0 0; pointer-events: none; }
.si-t { font-weight: 800; font-size: 16px; }
.si-h { font: 500 12px var(--mono); color: var(--accent-ink); }
.si-b { font-size: 13px; color: var(--mute); }
.si-tag { justify-self: start; margin-top: 6px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 24%, transparent); }
.live-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -6px 0 16px; }
.live-row > span { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin-right: 4px; }
.live-row button { display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: 11px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 600 13px var(--ui); cursor: pointer; }
.live-row button svg { width: 15px; height: 15px; color: var(--accent-ink); }
.live-row button:hover { border-color: var(--accent); }

/* appearance window */
.rice { display: grid; gap: 10px; }
.rice h2 { margin-bottom: 0; }
.rice h3 { margin: 16px 0 0; }
.rice-note, .lbl { margin: 0; color: var(--mute); font-size: 13px; }
.lbl { font-weight: 700; margin-top: 4px; }
.presets, .schemes { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; }
.pre, .sch { display: grid; gap: 8px; padding: 10px; border-radius: calc(var(--r) * .7); border: 1px solid var(--line); background: color-mix(in srgb, var(--surf2) var(--win-op), transparent); color: var(--fg); font: 700 13px var(--ui); text-align: left; cursor: pointer; }
.pre.on, .sch.on { border-color: var(--ring); box-shadow: 0 0 0 1px var(--ring); }
.pre:hover, .sch:hover { border-color: var(--mute); }
.sw { display: flex; height: 18px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.sw i { flex: 1; }
.sw-empty { font: 600 10px var(--ui); color: var(--mute); align-items: center; padding: 0 6px; height: 18px; white-space: nowrap; overflow: hidden; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: calc(var(--r) * .7); background: color-mix(in srgb, var(--surf2) var(--win-op), transparent); }
.seg button { flex: 1 1 auto; padding: 7px 10px; border: 0; border-radius: calc(var(--r) * .5); background: transparent; color: var(--fg); font: 600 13px var(--ui); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--a2); color: var(--on-a); }
.walls { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.wp { display: grid; gap: 4px; padding: 4px; border-radius: calc(var(--r) * .6); border: 2px solid transparent; background: none; color: var(--fg); font: 600 12px var(--ui); cursor: pointer; text-align: left; }
.wp canvas { width: 100%; aspect-ratio: 132 / 82; height: auto; border-radius: calc(var(--r) * .45); display: block; border: 1px solid var(--line); box-sizing: border-box; }
.wp.on { border-color: var(--ring); }
.wp span { padding: 0 2px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.up, .btn { display: inline-block; padding: 8px 14px; border-radius: calc(var(--r) * .6); background: var(--a1); color: var(--on-a); font: 700 13px var(--ui); cursor: pointer; border: 0; }
.btn.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
.tg { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 600; cursor: pointer; }
.tg input { width: 18px; height: 18px; accent-color: var(--a2); }
.sl { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 2px 10px; align-items: center; font-size: 14px; font-weight: 600; }
.sl span { grid-column: 1 / -1; }
.sl input { width: 100%; accent-color: var(--a2); }
.sl output { font: 600 12px var(--mono); color: var(--mute); text-align: right; font-variant-numeric: tabular-nums; }
.rings span { font-size: 14px; font-weight: 600; margin-right: 4px; }
.ringc { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surf); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.ringc.on { box-shadow: 0 0 0 2px var(--fg); }
.foot { margin-top: 10px; }

/* layout options */
.bar-attached .bar { margin: 0; border-radius: 0; border-width: 0 0 1px; }
.dock-hide .dock { position: absolute !important; left: 50%; bottom: 0; translate: -50% calc(100% - 8px); margin: 0 0 10px; z-index: 30 !important; }
.dock-hide .dock:hover, .dock-hide .dock:focus-within { translate: -50% 0; }
.dock-hide .dock::before { content: ""; position: absolute; left: 0; right: 0; top: -24px; height: 24px; }
.dock-hide .hello { bottom: 24px; }

.phone .bar { margin: 8px 8px 0; }
.phone.bar-attached .bar { margin: 0; }
/* an attached bar brings the dock with it: flush to the bottom edge, full width */
.bar-attached .dock, .phone.bar-attached .dock { margin: 0; max-width: none; width: 100%; border-radius: 0; border-width: 1px 0 0; justify-content: center; padding-bottom: max(8px, env(safe-area-inset-bottom)); }
.bar-attached.dock-hide .dock { margin: 0; }
#desk { grid-template-columns: minmax(0, 1fr); }
.phone .chipb, .phone .hide-phone, .phone #b-keys, .phone .clock span { display: none; }
.phone .dock { margin: 0 8px 8px; margin-bottom: max(8px, env(safe-area-inset-bottom)); justify-content: flex-start; max-width: none; }
.phone .dk { width: 44px; height: 44px; }
.phone .wb { padding: 4px 16px 18px; }
.phone .win[data-kind="site"] .wb { padding: 0; }
.phone .cs-body { grid-template-columns: minmax(0, 1fr); }
.phone .cs-body aside { display: none; }
.phone .si { grid-template-columns: 90px minmax(0, 1fr); }
.phone .si-prev { height: 80px; }
.phone .hello { bottom: 76px; }
.phone .ss-box { grid-template-columns: repeat(2, minmax(0, 1fr)); }

<body>
<div id="desk" class="preboot">
  <canvas id="wall" aria-hidden="true"></canvas>
  <header class="bar">
    <div class="b-sec b-left">
      <button type="button" class="ib logo" id="b-launch" aria-label="Open launcher (D)" title="Launcher (D)">${ICON.search}</button>
      <button type="button" class="zoomb hide-phone" id="b-over" aria-label="Zoom out" title="See every workspace at once (O)"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect class="z1" x="1" y="2" width="3.5" height="12" rx="1.2"/><rect class="z2" x="6.25" y="2" width="3.5" height="12" rx="1.2"/><rect class="z3" x="11.5" y="2" width="3.5" height="12" rx="1.2"/><rect class="z4" x="9" y="9" width="5" height="5" rx="1.2"/></svg><span class="zl"><span>Zoom out</span><span>Zoom in</span></span></button>
      <div class="pills" id="pills" role="tablist" aria-label="Workspaces"></div>
    </div>
    <div class="b-sec"><button type="button" class="clock" id="clock" title="Control centre (N)"></button></div>
    <div class="b-sec b-right">
      <div class="media hide-phone" id="media"><canvas width="36" height="18" aria-hidden="true"></canvas><button type="button" class="m-t" id="m-open" title="Music player">Music</button><button type="button" class="m-pp" id="m-pp" aria-label="Play music (M)" title="Play or pause (M)">${ICON.play}</button></div>
      <span class="chipb" title="Sample value">Workshop <b>27.4°C</b></span>
      <button type="button" class="ib hide-phone" id="b-rice" aria-label="Appearance (S)" title="Appearance (S)">${ICON.sliders}</button>
      <button type="button" class="ib" id="b-keys" aria-label="Keyboard shortcuts (?)" title="Shortcuts (?)">${ICON.keys}</button>
      <button type="button" class="ib" id="b-cc" aria-label="Control centre (N)" title="Control centre (N)" aria-expanded="false">${ICON.panel}</button>
      <button type="button" class="ib" data-theme-toggle aria-label="Switch light or dark" title="Light or dark">${ICON.moon}</button>
    </div>
  </header>
  <main class="viewport" aria-label="Windows"></main>
  <nav class="dock" aria-label="Dock"></nav>
  <div class="session" hidden>
    <div class="ss-box" role="dialog" aria-label="Session menu">
